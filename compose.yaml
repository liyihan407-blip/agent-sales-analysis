name: agent-sales-analysis
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sales_agent}
      MYSQL_USER: ${MYSQL_USER:-sales_agent}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请填写 MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请填写 MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./jc-sales-agent/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./jc-sales-agent/src/main/resources/db/data.sql:/docker-entrypoint-initdb.d/02-demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks: [data]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请填写 REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?请填写 REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [data]
  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8087"
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-sales_agent}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${MYSQL_USER:-sales_agent}
      DB_PASSWORD: ${MYSQL_PASSWORD:?请填写数据库密码}
      DB_INIT_MODE: never
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请填写 Redis 密码}
      AI_API_KEY: ${AI_API_KEY:?请填写模型 API Key}
      AI_BASE_URL: ${AI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      AI_MODEL_NAME: ${AI_MODEL_NAME:-qwen-max}
      APP_AUTH_ENABLED: "true"
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65.0 -Dfile.encoding=UTF-8
      TZ: Asia/Shanghai
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8087"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks: [data, app]
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:80"
      - "${BIND_ADDRESS:-127.0.0.1}:${MOBILE_PORT:-8081}:8081"
    depends_on:
      backend: { condition: service_healthy }
    networks: [app]
volumes:
  mysql-data:
  redis-data:
networks:
  data: { internal: true }
  app:

location ~ ^/(?:api/)?(?:auth/(?:login|logout)|agent/(?:chat(?:/stream)?|session/[^/]+))$ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://backend:8087;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
location ~ ^/(?:api|auth|agent|test|actuator|swagger-ui|v3/api-docs)(?:/|$) { return 404; }
location ~ (^|/)\. { return 404; }
location ~* \.(?:map|ya?ml|properties|sql|env|log|pem|key)$ { return 404; }

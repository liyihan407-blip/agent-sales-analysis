server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    include /etc/nginx/api-routes.conf;
    location / { try_files $uri $uri/ /index.html; }
}
server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/mobile;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    include /etc/nginx/api-routes.conf;
    location / { try_files $uri $uri/ /index.html; }
}
